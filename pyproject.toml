[project]
name = "cotaudit"
version = "0.1.0"
description = "Hint-insertion audit of chain-of-thought faithfulness across English, Hindi, Chinese and Malayalam"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "datasets>=3.0",
    "pandas>=2.2",
    "pyyaml>=6.0",
    "groq>=0.30",
    "tenacity>=9.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
kaggle = ["vllm>=0.10"]

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cotaudit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
